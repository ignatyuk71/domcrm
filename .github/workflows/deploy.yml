name: Deploy to Mirohost

on:
  push:
    branches:
      - main

# Деплої не ганяються наввипередки: новий пуш скасовує той, що ще їде.
# Інакше старіший може фінішувати останнім і відкотити свіжий код (було двічі).
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Install rsync & sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      # Деплой через SSH (rsync) — надійніше за FTP на Mirohost.
      # Без --delete: лише додає/оновлює файли, нічого не видаляє (безпечно).
      - name: Deploy code via rsync over SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltz --checksum \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='.env' \
            ./ domcrm_ssh@vs2489.mirohost.net:/var/www/domcrm/domcrm.com.ua/

      # Міграції + скидання кешу прямо в деплої (більше не вручну).
      - name: Run migrations & clear caches
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            domcrm_ssh@vs2489.mirohost.net \
            'cd /var/www/domcrm/domcrm.com.ua && php artisan migrate --force && php artisan optimize:clear'
