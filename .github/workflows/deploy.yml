name: Deploy to Hetzner

on:
  push:
    branches:
      - main

# Деплої не ганяються наввипередки: новий пуш скасовує той, що ще їде.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # Запускаємо deploy.sh прямо на сервері (він сам тягне свіжий код із GitHub:
      # clone → composer install → симлінки → migrate --force → перемикання current → reload php-fpm).
      - name: Run deploy.sh on Hetzner via SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy@89.167.66.67 \
            'bash /var/www/domcrm.com.ua/deploy.sh'
